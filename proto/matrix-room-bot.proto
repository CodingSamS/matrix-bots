syntax = "proto3";
package matrix_room_bot;

service matrix_room_bot {
    rpc sync_public_keys(PublicKeyMessage) returns (PublicKeyMessage);
    rpc load_cipher(EncryptionData) returns (SessionState);
    rpc send(SendMessage) returns (Empty);
    rpc start(Empty) returns (Empty);
    rpc stop(Empty) returns (Empty);
}

message PublicKeyMessage {
    bytes public_key_bytes = 1;
}

message EncryptionData {
    bytes encryption_key_ciphertext = 1;
    bytes nonce = 2;
}

message SendMessage {
    string message = 1;
}

message Empty {}

enum SessionStateEnum {
    SessionExists = 0;
    SessionMissing = 1;
}

message SessionState {
    optional SessionStateEnum session_state = 1;
}



